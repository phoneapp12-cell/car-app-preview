<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Info Book</title>
<meta name="description" content="Shane's private photo and video feed. No likes, comments or followers.">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32"><link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Info Book">
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#14161b;--mute:#6b7280;--line:#e7e8ee;--chip:#eceef3;--acc:#8b5cf6;--acc2:#ec4899;--up:#16a34a;--down:#dc2626;--shadow:0 1px 2px rgba(16,24,40,.06),0 6px 18px rgba(16,24,40,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0d11;--card:#15181e;--ink:#eef0f4;--mute:#9aa1ad;--line:#242833;--chip:#1e222b;--shadow:0 1px 0 rgba(255,255,255,.03)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px 6px;max-width:640px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.35rem;letter-spacing:-.02em}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#f59e0b,var(--acc2) 55%,var(--acc));display:grid;place-items:center;font-style:normal;font-size:1rem;color:#fff}
.logo span{background:linear-gradient(90deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .lt{display:flex;flex-direction:column;line-height:1.08;min-width:0}.greet{font-size:.74rem;font-weight:700;letter-spacing:0;color:color-mix(in srgb,var(--acc2) 70%,var(--acc));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}.greet:empty{display:none}
.mood{margin-left:auto;font-size:.74rem;font-weight:600;color:var(--mute);background:color-mix(in srgb,var(--mute) 12%,transparent);border-radius:99px;padding:3px 9px;white-space:nowrap}.mood:empty{display:none}.mood+.upd{margin-left:8px}
.fb{border:0;background:none;font-size:1.05rem;padding:8px 6px;border-radius:10px;color:var(--mute);display:inline-flex;align-items:center;gap:3px;position:relative;cursor:pointer}
.fb .cc{font-size:.85rem;font-weight:700}.fb .dot{width:7px;height:7px;border-radius:50%;background:#e11d48;position:absolute;top:6px;right:2px}
.cmts{border-top:1px solid var(--line);padding:8px 12px 12px}.cm{padding:6px 0;position:relative}.cm b{font-size:.9rem}.cm small{color:var(--mute);font-size:.75rem}.cm p{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}
.cm0{color:var(--mute);font-size:.9rem;padding:4px 0}.cx{position:absolute;right:0;top:4px;border:0;background:none;color:var(--mute);font-size:.85rem;padding:4px 6px}
.cf{display:flex;gap:8px;margin-top:8px}.cf textarea{flex:1;resize:vertical;min-height:40px;border:1px solid var(--line);border-radius:12px;padding:9px 11px;font:inherit;background:var(--bg);color:inherit}.cf .btn{margin:0;width:auto;padding:0 16px}
.shby{padding:10px 14px 0;font-size:.85rem;color:var(--mute)}.shby b{color:inherit}.shby p{margin:4px 0 0;color:inherit;font-style:italic}.shby .mini{float:right;margin-top:-3px}
.card.shared{box-shadow:0 0 0 2px color-mix(in srgb,var(--c1) 45%,transparent)}
.inst{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:14px 0}.inst p{margin:4px 0 8px;font-size:.9rem}.inst .btn{margin:4px 0 0}.ipic{width:100%;max-width:260px;display:block;margin:6px auto}
.plink{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:11px;font:inherit;background:var(--bg);color:inherit;margin:6px 0}
.famh{margin:18px 16px 8px;font-size:1rem}
.obg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.obt{display:flex;align-items:center;gap:8px;text-align:left;border:2px solid var(--line);background:var(--card,transparent);color:inherit;border-radius:14px;padding:10px;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer}
.obt span{font-size:1.3rem}.obt.on{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 16%,transparent)}
.famadd{display:flex;gap:8px;margin:10px 0}.famadd input,.famlnk input{flex:1;width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;background:var(--bg);color:inherit;box-sizing:border-box}.famadd .btn{margin:0;width:auto;white-space:nowrap}
.famlnk{border:1px dashed var(--line);border-radius:14px;padding:12px;margin:8px 0 14px}.famlnk p{font-size:.85rem;color:var(--mute);margin:4px 0 8px}.famlnk .btn{margin-top:8px}
.upd{margin-left:auto;font-size:.78rem;color:var(--mute);text-align:right;line-height:1.2}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:1.1rem;background:var(--chip)}
.ib.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 14px 10px;scrollbar-width:none;max-width:640px;margin:0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--chip);font-weight:600;font-size:.9rem;white-space:nowrap;transition:transform .15s}
.chip.on{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;box-shadow:0 4px 12px rgba(139,92,246,.32)}
.chip:active{transform:scale(.95)}
main{max-width:640px;margin:0 auto;padding:12px 10px calc(40px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);margin:0 0 16px;overflow:hidden;border:1px solid var(--line);animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.hd{display:flex;align-items:center;gap:10px;padding:12px 14px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:1.1rem;flex:none;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 0 0 2px var(--card),0 0 0 4px color-mix(in srgb,var(--c1) 55%,transparent)}
.who{min-width:0;flex:1}
.who b{display:block;font-size:.93rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--mute);font-size:.78rem}
.tp{font-size:.72rem;font-weight:700;padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--c1) 16%,transparent);color:color-mix(in srgb,var(--c1) 80%,var(--ink));white-space:nowrap}
.media{position:relative;background:#000;display:block;width:100%}
.media img{display:block;width:100%;max-height:560px;object-fit:cover;background:var(--chip)}
.media.vid{aspect-ratio:16/9;overflow:hidden;cursor:pointer}
.media.vid .vthumb{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:cover;z-index:2;transition:opacity .35s}
.media.vid .vslot,.media.vid .vslot iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:1}
.media.vid .play{z-index:3;pointer-events:none;transition:opacity .25s}
.media.vid.playing .vthumb,.media.vid.playing .play{opacity:0;pointer-events:none}
.media.vid .snd{position:absolute;right:10px;bottom:10px;z-index:4;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.6);color:#fff;backdrop-filter:blur(6px);box-shadow:0 2px 10px rgba(0,0,0,.35);border:0;padding:0}
.media.vid .snd svg{width:22px;height:22px}
.media.vid .snd.on{background:rgba(255,255,255,.92);color:#111}
.media.vid.verr .snd{display:none}
.media.vid .lwhen{z-index:4}
.media.tall img{max-height:620px}
.play{position:absolute;inset:0;display:grid;place-items:center}
.play span{width:68px;height:68px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.play span::after{content:"";border-left:22px solid #fff;border-top:13px solid transparent;border-bottom:13px solid transparent;margin-left:6px}
.dur{position:absolute;left:10px;bottom:10px;font-size:.75rem;font-weight:700;color:#fff;background:rgba(0,0,0,.6);padding:3px 8px;border-radius:8px}
.media iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
.hero{padding:28px 20px;min-height:200px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;background:linear-gradient(140deg,var(--c1),var(--c2));position:relative}
.hero .em{font-size:2.6rem;position:absolute;top:16px;right:18px;opacity:.9}
.hero h3{margin:0;font-size:1.3rem;line-height:1.25;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.bd{padding:12px 14px 4px}
.bd h3{margin:0 0 4px;font-size:1.02rem;line-height:1.3}
.bd p{margin:0;color:var(--mute);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bd p.open{-webkit-line-clamp:unset}
.when{display:inline-block;margin:6px 0 0;font-size:.78rem;font-weight:700;color:var(--acc)}
.ft{display:flex;align-items:center;gap:8px;padding:8px 10px 12px}
.vote{display:grid;place-items:center;width:46px;height:42px;border-radius:999px;color:var(--mute);transition:transform .12s,color .2s,background .2s}
.vote svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:fill .2s}
.vote:active{transform:scale(.88)}
.vote.on.up{color:var(--up);background:color-mix(in srgb,var(--up) 12%,transparent)}
.vote.on.dn{color:var(--down);background:color-mix(in srgb,var(--down) 12%,transparent)}
.vote.on svg .sh{fill:currentColor}
.vote.on svg .ln{stroke:var(--card);stroke-width:2.2}
.pinhd{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:1rem;margin:4px 4px 10px}
.pinhd.sub{margin-top:18px;color:var(--mute);font-size:.9rem}
.pinhd button{font-size:.85rem;font-weight:700;color:var(--acc)}
.life .lhero{display:flex;align-items:center;gap:14px;padding:16px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;position:relative;overflow:hidden}
.life .lhero::after{content:"";position:absolute;right:-30px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12)}
.life .lem{font-size:2.3rem;line-height:1;width:58px;height:58px;display:grid;place-items:center;border-radius:18px;background:rgba(255,255,255,.18);flex:none}
.life .lhx{display:flex;flex-direction:column;gap:6px;min-width:0}
.life .lcat{font-size:.78rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;opacity:.92}
.life .lwhen{align-self:flex-start;font-size:.85rem;font-weight:800;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.22)}
.life .lwhen.now{background:#fff;color:var(--c1)}
.life.hot{box-shadow:0 0 0 2px color-mix(in srgb,var(--c1) 60%,transparent),var(--shadow)}
.life .bd h3{font-size:1.08rem}
.life .media.lm{overflow:hidden;background:linear-gradient(135deg,var(--c1),var(--c2))}
.life .media.lm img,.life .media.lm .lph{display:block;width:100%;aspect-ratio:1/1;max-height:none;object-fit:cover}
.life.tallpic .media.lm img,.life.tallpic .media.lm .lph{aspect-ratio:4/5}
.life .lph{display:grid;place-items:center;background:linear-gradient(135deg,var(--c1),var(--c2));position:relative;overflow:hidden}
.life .lph span{font-size:5.5rem;filter:drop-shadow(0 6px 18px rgba(0,0,0,.25))}
.life .media.need:not(.nopic) .lph::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);background-size:200% 100%;animation:shim 1.4s infinite}
@keyframes shim{from{background-position:150% 0}to{background-position:-50% 0}}
.life .media .lwhen{position:absolute;left:12px;top:12px;z-index:2;font-size:.85rem;font-weight:800;padding:5px 11px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(6px)}
.life .media .lwhen.now{background:#fff;color:var(--c1)}
.life .av{background:linear-gradient(135deg,var(--c1),var(--c2))}
.life .lsub{color:var(--mute);font-weight:600;margin-top:2px}
.life .cred{display:block;color:var(--mute);font-size:.72rem;margin-top:6px;opacity:.8}
.lbtn{padding:9px 14px;border-radius:999px;background:color-mix(in srgb,var(--c1) 14%,var(--chip));color:color-mix(in srgb,var(--c1) 75%,var(--ink));font-weight:700;font-size:.88rem;text-decoration:none}
.lbtn.ghost{background:var(--chip);color:var(--mute)}
.lx{margin-left:auto;width:38px;height:38px;border-radius:50%;color:var(--mute);font-size:1rem}
.empty a{color:var(--acc);font-weight:700}
.vote.pop{animation:pop .35s}@keyframes pop{50%{transform:scale(1.25)}}
.open-l{margin-left:auto;font-size:.85rem;font-weight:600;color:var(--mute);text-decoration:none;padding:8px 10px}
.gone{padding:16px;display:flex;align-items:center;gap:10px;color:var(--mute);font-size:.9rem}
.gone button{margin-left:auto;font-weight:700;color:var(--acc)}
.empty,.load{text-align:center;color:var(--mute);padding:40px 20px}
.sk{height:380px;border-radius:20px;margin-bottom:16px;background:linear-gradient(90deg,var(--chip),var(--card),var(--chip));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .in{background:var(--card);width:100%;max-width:640px;border-radius:22px 22px 0 0;max-height:85vh;overflow:auto;padding:18px 18px calc(24px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 6px;font-size:1.2rem}
.sheet p{color:var(--mute);font-size:.9rem;margin:6px 0 12px}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:.88rem}
.row span:last-child{color:var(--mute);text-align:right}
.btn{display:block;width:100%;padding:12px;border-radius:14px;background:var(--chip);font-weight:700;margin-top:10px;text-align:center;text-decoration:none}
.btn.pri{background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120px);background:#111827;color:#fff;padding:10px 16px;border-radius:999px;font-size:.88rem;font-weight:600;transition:transform .25s;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3);white-space:nowrap}
.toast.on{transform:translateX(-50%) translateY(0)}
.mx{font-size:.66rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--acc2);margin-left:6px;white-space:nowrap;display:inline-block}
.media.lowres{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--chip);min-height:180px}.media.lowres::before{content:'';position:absolute;inset:-30px;background:var(--lr) center/cover;filter:blur(26px) saturate(1.3);opacity:.55}.media.lowres img{position:relative;height:auto!important;max-height:none;object-fit:contain;margin:16px auto;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.sst{display:block;font-size:.72rem;color:var(--mute);margin-top:1px}.sst.try{color:#2563eb}.sst.more{color:#16a34a}.sst.less{color:#b45309}.sst.drop{color:#dc2626}
.mini{font:inherit;font-size:.78rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:inherit}
.sgh{margin:14px 0 2px;font-size:.85rem}
.ichs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}.ich{font:inherit;font-size:.8rem;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mute)}.ich.on{background:var(--chip);color:inherit;font-weight:600;border-color:transparent}
.upb{display:block;width:calc(100% - 24px);margin:4px 12px 10px;padding:13px;font-size:1rem}
.fph{display:grid;gap:3px;background:var(--line)}.fph.n2,.fph.n4{grid-template-columns:1fr 1fr}.fph.n3{grid-template-columns:1fr 1fr}.fph.n3 img:first-child{grid-column:1/3}
.fph img{width:100%;display:block;object-fit:cover;background:var(--chip);min-height:120px;cursor:zoom-in}.fph.n1 img{max-height:70vh}.fph:not(.n1) img{aspect-ratio:1}.fph img.gone{display:none}
.upbox{position:fixed;inset:0;z-index:60;background:rgba(10,10,20,.55);display:flex;align-items:flex-end;justify-content:center}
.upin{background:var(--card);color:var(--ink);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.upth{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0;color:var(--mute)}.upth img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
#upcap{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;background:var(--bg);color:var(--ink)}
.uprow{display:flex;gap:8px;justify-content:flex-end}
.lbx{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:grid;place-items:center}.lbx img{max-width:100%;max-height:100%}
.logo img{width:30px;height:30px;border-radius:9px;display:block;box-shadow:0 3px 10px rgba(236,72,153,.3)}
.fb.lk.on{color:#e11d48;--hf:#e11d48}.fb.lk:active svg{transform:scale(1.2)}.fb.lk svg{transition:transform .15s}
.lkn{border:0;background:none;color:var(--ink);font:inherit;font-size:.85rem;font-weight:600;padding:8px 6px 8px 0;cursor:pointer;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{position:relative}.rxl{display:flex;flex-wrap:wrap;gap:4px 14px;width:100%;text-align:left;border:0;background:none;font:inherit;font-size:.86rem;font-weight:600;color:var(--ink);padding:2px 16px 0;cursor:pointer}.rxc{font-size:.85rem;font-weight:700;margin-left:3px}.vote .rxc{color:inherit}.updbar{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:80;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,#ec4899,#8b5cf6);box-shadow:0 8px 24px rgba(139,92,246,.4)}.popl{margin:8px 0 0;font-size:.82rem;font-weight:600;color:#be185d}.ndot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e11d48;margin:0 4px 0 -2px;vertical-align:middle}.lkl h3{margin:12px 0 2px}.chip .dot{width:8px;height:8px;border-radius:50%;background:#e11d48;position:absolute;top:4px;right:6px}
.lkl .row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="logo"><img src="icons/logo.svg" width="30" height="30" alt=""><div class="lt"><span>Info Book</span><small class="greet" id="greet"></small></div></div>
    <div class="mood" id="mood"></div>
    <div class="upd" id="upd"></div>
    <button class="ib" id="rf" aria-label="Refresh">↻</button>
    <button class="ib" id="st" aria-label="Settings">⚙︎</button>
  </div>
  <nav class="chips" id="chips" aria-label="Interests"></nav>
</header>
<main id="feed"><div class="sk"></div><div class="sk"></div></main>
<div class="sheet" id="sheet"><div class="in" id="sheetin"></div></div>
<div class="toast" id="toast"></div>
<script src="family.js?v=1.8.5"></script>
<script src="app.js?v=1.8.5"></script>
</body>
</html>
