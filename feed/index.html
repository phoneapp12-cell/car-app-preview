/* ---- 1.9.52 ✨ card polish: every card the same shape – same gap, padding, radius and shadow; a big full-width picture or
   video on top at 16:9 (portrait posters 4:5, Shorts/TikTok/Reels 9:16 capped), space reserved so nothing jumps while
   loading, a soft candy picture if one fails, and a picture band on the text-only cards (quiz, trivia, countdowns…). ---- */
#feed{display:flex;flex-direction:column;gap:16px}
#feed > .card{margin:0!important;border-radius:20px!important;border:1px solid var(--line)!important;overflow:hidden}
#feed > .card > .bd,#feed > .card .bd{padding:14px 16px 6px}
#feed > .card .ft,#feed > .card .xbtns{padding-left:16px;padding-right:16px}
#feed .card .media:not(.vid):not(.lowres) img,#feed .card .pimg img,#feed .card .bdpic img{width:100%;height:auto;aspect-ratio:16/9!important;max-height:none!important;object-fit:cover;display:block;background:var(--chip) url(img/card-fallback.svg) center/cover}
#feed .card .media.tall:not(.vid):not(.lowres) img{aspect-ratio:4/5!important;max-height:72vh!important}
#feed .card .media.lowres{aspect-ratio:16/9;min-height:0}
#feed .card .media.lowres img{max-height:85%!important;max-width:80%;width:auto!important}
#feed .card .fph.n1 img{aspect-ratio:4/3;max-height:none;object-fit:cover}
#feed .card .media.vid{aspect-ratio:16/9;width:100%}
#feed .card .media.vid.tall{aspect-ratio:9/16;width:min(100%,calc(70vh*9/16));margin:0 auto}
#feed .card:has(.media.vid){margin:0!important;border-radius:20px!important}
#feed .card .media img[data-broken]{object-fit:cover}
#feed > .card > .media,#feed > .card > a.media,#feed > .card > .pimg,#feed > .card > .fph{margin:0}
/* text-only cards get a picture band (emoji on a pastel candy gradient) */

@media (prefers-color-scheme:dark){#feed > .card.xc:not(:has(.media,.pimg,.fph,.bdpic,.hero))::before{background:linear-gradient(120deg,#4a2a40,#3d3a26 35%,#1f3d36 65%,#33295a)}}
#feed > .card.daily{--band-e:'📸'}#feed > .card.trivia{--band-e:'❓'}#feed > .card.sugg{--band-e:'💡'}#feed > .card.reno{--band-e:'🏠'}#feed > .card.wkr{--band-e:'📅'}#feed > .card.fest.ny{--band-e:'🎆'}#feed > .card.fest.xmas{--band-e:'🎄'}#feed > .card.wx-nz{--band-e:'⛅'}

.plsrc{font-size:.78rem;color:var(--mute);margin:6px 0 0}
.plsrc a{color:var(--acc);font-weight:700}
.plwarn{margin:8px 0;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,#f59e0b 22%,var(--card));color:var(--ink);font-weight:700}
.artwin{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;background:#000;color:#fff}
.artwin[hidden]{display:none!important}
.artbar{display:flex;align-items:center;gap:8px;min-height:48px;padding:6px 8px;background:#141414}
.artx{min-height:44px;border-radius:12px;border:0;background:#fff;color:#111;font-weight:800;padding:8px 12px}
.artmeta{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.artmeta strong{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artsite{color:#fff;font-weight:800;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artlive{font-size:.72rem;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artframe{flex:1 1 auto;width:100%;min-height:0;border:0;background:#000}
@media (prefers-reduced-motion:reduce){#feed > .card.puzzle *,#feed > .card.zoomq *,#feed > .card.fallq *,#feed > .card.tetq *,#feed > .card.cine *{animation:none!important;transition:none!important}}
/* 1.9.110 main-feed videos fill the card width. Landscape stays 16:9, portrait (Shorts) stays 9:16.
   The picture and the player are contained, not cropped or stretched. Swipe rows do not hold videos. */
#feed > .card:has(> .media.vid){min-height:0!important;height:auto}
#feed > .card > .media.vid{flex:0 0 auto;width:100%!important;max-width:100%!important;margin:0!important;aspect-ratio:16/9;max-height:calc(100svh - var(--hdr, 96px) - 132px);background:#000}
#feed > .card > .media.vid.tall{width:min(100%, calc((100svh - var(--hdr, 96px) - 132px) * 9 / 16))!important;max-width:100%;aspect-ratio:9/16;max-height:calc(100svh - var(--hdr, 96px) - 132px);margin-left:auto!important;margin-right:auto!important}
#feed > .card > .media.vid .vthumb,#feed > .card > .media.vid video,#feed > .card > .media.vid iframe{object-fit:contain!important;background:#000;width:100%;height:100%}
.media.vid.armed .vthumb,.media.vid.playing .vthumb,.media.vid.armed .play,.media.vid.playing .play{opacity:0;pointer-events:none}
.media.vid .snd,.media.vid .fsb{opacity:0;pointer-events:none}
.media.vid.showbar .snd,.media.vid.showbar .fsb,.media.vid:focus-within .snd,.media.vid:focus-within .fsb{opacity:1;pointer-events:auto}
.stmedia.stv.land iframe,.stmedia.stv.land video{width:100%!important;height:auto!important;aspect-ratio:16/9;max-height:70vh!important;object-fit:contain}
.stmedia.stv.tall iframe,.stmedia.stv.tall video{width:min(100%, calc(78vh * 9 / 16))!important;aspect-ratio:9/16;max-height:78vh!important;object-fit:contain}
#feed > .hrow{/* picture rows only */}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="logo"><img src="icons/logo.svg" width="30" height="30" alt=""><div class="lt"><span class="ttl">Info Book<small id="stchip" class="stchip" hidden></small></span><small class="greet" id="greet"></small></div></div>
    <div class="mood" id="mood"></div>
    <div class="upd" id="upd"></div>
    <button class="ib" id="rf" aria-label="Refresh">↻</button>
    <button class="ib" id="st" aria-label="Settings">⚙︎</button>
  </div>
  <!-- 1.9.82 chips moved into ☰ menu; keep empty node for any leftover refs -->
  <nav class="chips" id="chips" aria-label="Interests" hidden></nav>
  <div id="backfeed" class="backfeed" hidden><button type="button" class="backpill" data-backfeed>← Back to feed</button></div>
</header>
<div id="stories-host" class="stories-host" aria-label="Stories"></div>
<main id="feed"><div class="sk"></div><div class="sk"></div></main>
<div class="sheet" id="sheet"><div class="in" id="sheetin"></div></div>
<div class="toast" id="toast"></div>
<script src="family.js?v=1.9.110"></script>
<script src="app.js?v=1.9.110"></script>
<script src="extras.js?v=1.9.110"></script>

<script src="common-en.js?v=1.9.110"></script>
<script src="explain.js?v=1.9.110"></script>

<script src="weekly.js?v=1.9.110"></script>

<script src="nz.js?v=1.9.110"></script>
<script src="read.js?v=1.9.110"></script>
<script>
/* 1.9.82 self-heal: if the feed is still skeletons after 9s (crash/stale cache), offer a manual reload.
   Auto-reload only on a real JS error, at most once per 10 minutes (localStorage). No controllerchange reload —
   new SW versions apply quietly on the next open. */
(function () {
  var fix = function () { var done = function () { location.replace(location.pathname + '?fresh=' + Date.now()); };
    try { Promise.all([caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }), navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.update(); })); }) : 0]).then(done, done); } catch (e) { done(); } };
  window.__ibErr = 0; addEventListener('error', function () { window.__ibErr++; });
  setTimeout(function () {
    var f = document.getElementById('feed'); if (!f || f.querySelector('.card,.empty,.load') || !f.querySelector('.sk')) return;
    f.insertAdjacentHTML('afterbegin', '<div class="empty" id="ibheal">😕 Info Book didn’t load properly.<br><br><button class="btn pri" id="ibfix">↻ Reload Info Book</button></div>');
    document.getElementById('ibfix').onclick = fix;
    if (window.__ibErr) {
      var last = +localStorage.getItem('ibAutoFixAt') || 0;
      if (Date.now() - last > 10 * 60 * 1000) { localStorage.setItem('ibAutoFixAt', String(Date.now())); fix(); }
    }
  }, 9000);
  // 1.9.82: do NOT reload on controllerchange — that caused open-time restart loops on PWA cold starts
})();
</script>
</body>
</html>
