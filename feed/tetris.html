<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tetris</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0b0e; color: #fff; font-family: ui-sans-serif, system-ui, sans-serif; }
  body { box-sizing: border-box; padding: 16px; }
  .wrap { max-width: 440px; margin: 0 auto; }
  h1 { font-size: 28px; line-height: 1.2; font-weight: 700; margin: 0 0 4px; }
  .help { font-size: 14px; color: rgba(255,255,255,.75); margin: 0 0 12px; }
  .stats { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 8px; }
  .row, .play { display: flex; flex-wrap: wrap; gap: 8px; }
  .stats { margin-bottom: 12px; }
  .stat { flex: 1 1 64px; padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.12); }
  .stat.big { min-width: 0; }
  .stat span { display: block; font-size: 11px; color: rgba(255,255,255,.55); text-transform: uppercase; letter-spacing: .06em; }
  .stat strong { display: block; font-size: 20px; line-height: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat.big strong { font-size: 28px; line-height: 34px; }
  .boardrow { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
  canvas#board { touch-action: none; user-select: none; flex: 1 1 160px; width: auto; max-width: min(280px, 100%); max-height: calc(100dvh - 400px); aspect-ratio: 10 / 20; border-radius: 10px; border: 1px solid rgba(255,255,255,.12); display: block; }
  .side { flex: 0 1 88px; min-width: 72px; }
  .side p { font-size: 11px; color: rgba(255,255,255,.55); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 6px; }
  .side canvas { width: 100%; max-width: 88px; border-radius: 10px; border: 1px solid rgba(255,255,255,.12); display: block; margin-bottom: 12px; }
  button { flex: 1 1 56px; min-height: 48px; border-radius: 12px; border: 1px solid rgba(255,255,255,.12); background: #1c1f27; color: #fff; font: 500 16px/1 ui-sans-serif, system-ui, sans-serif; cursor: pointer; touch-action: manipulation; }
  button.wide { flex: 1 1 120px; }
  .side button { width: 100%; margin-bottom: 8px; font-size: 14px; }
  .row { margin-top: 12px; }
  .play { margin-top: 8px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Tetris</h1>
    <p class="help">Tap the board to rotate, drag to move, flick down to drop, swipe up to hold. Keyboard: arrows, Space drops, C holds, P pauses, M toggles music.</p>
    <div class="stats">
      <div class="stat big"><span>Score</span><strong id="score">0</strong></div>
      <div class="stat"><span>Best</span><strong id="best">0</strong></div>
      <div class="stat"><span>Level</span><strong id="level">1</strong></div>
      <div class="stat"><span>Lines</span><strong id="lines">0</strong></div>
    </div>
    <div class="boardrow">
      <canvas id="board" width="280" height="560"></canvas>
      <div class="side">
        <p>Next</p>
        <canvas id="next" width="80" height="56"></canvas>
        <p>Hold</p>
        <canvas id="hold" width="80" height="56"></canvas>
        <button type="button" id="musicbtn">Music on</button>
        <button type="button" id="soundbtn">Sound on</button>
      </div>
    </div>
    <div class="row">
      <button type="button" data-act="left" aria-label="Left">◀</button>
      <button type="button" data-act="rotate" aria-label="Rotate">⟳</button>
      <button type="button" data-act="right" aria-label="Right">▶</button>
      <button type="button" data-act="down" aria-label="Down">▼</button>
    </div>
    <div class="play">
      <button type="button" class="wide" data-act="drop">Drop</button>
      <button type="button" data-act="hold">Hold</button>
      <button type="button" id="pausebtn" data-act="pause">Pause</button>
      <button type="button" id="restartbtn" data-act="restart">Restart</button>
    </div>
  </div>
  <script src="tetris.js"></script>
</body>
</html>
