.hcar-stage{
  position:relative;height:calc(100dvh - 7.25rem);min-height:min(70vh,520px);
  overflow:hidden;border-radius:22px;touch-action:pan-y;background:transparent;
  -webkit-user-select:none;user-select:none;
}
.hcar-track{
  display:flex;height:100%;width:100%;will-change:transform;touch-action:pan-y;
}
.hcar-item{
  flex:0 0 100%;width:100%;height:100%;min-width:0;
  border-radius:22px;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.14);
  background:transparent;touch-action:pan-y;
}
.hcar-item .hsec{
  height:100%;margin:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior-x:contain;overscroll-behavior-y:auto;
  -webkit-overflow-scrolling:touch;
  border-top:0!important;padding-top:4px;scrollbar-width:thin;
  touch-action:pan-y;-webkit-user-select:text;user-select:text;
}
.hcar-item:not(.hcar-front) .hsec{pointer-events:none}
.hcar-locked .hcar-item .hsec{overflow-y:hidden!important}
.hcar-dots{
  position:absolute;left:0;right:0;bottom:10px;z-index:2;
  display:flex;justify-content:center;gap:7px;flex-wrap:wrap;pointer-events:none;
  padding:0 12px;
}
.hcar-dot{
  pointer-events:auto;width:8px;height:8px;border-radius:50%;padding:0;
  background:var(--ink3);opacity:.4;border:0;cursor:pointer;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--bg) 55%,transparent);
}
.hcar-dot.on{background:var(--brand);opacity:1;transform:scale(1.2)}
.hcar-hint{font-size:0.75rem;text-align:center;margin:8px 0 2px;opacity:.72}
.hfeed .hcar-hint{margin:0 0 10px}
@media (prefers-reduced-motion: reduce){
  .hcar-track{transition:none!important}
}

.gymimg{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:12px;background:#0002;display:block;cursor:pointer}
/* 2.22.89: New World Onerahi shopping list question */

.nwask .nwasktx{flex:1;min-width:0} .nwask .t{font-weight:750;font-size:1.0625rem} .nwask .s{font-size:0.9375rem;color:var(--ink2);margin-top:2px}

/* 2.22.99 header cat */
.top:has(.hcat){position:relative;min-height:94px}
.top:has(.hcat)>div:first-child{flex:1}
.top:has(.hcat) .sub{max-width:calc(100% - 78px)}
.top .sub .subhi,.top .sub .subdate{display:block}
.top .sub .subdate{color:var(--ink3);font-size:0.875rem;margin-top:1px}
.hcat{display:block;position:absolute;right:40px;top:-8px;width:116px;height:96px;margin:0;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;color:inherit}
.hcat svg{width:116px;height:96px;overflow:visible;display:block}
.hcat svg *{transform-box:fill-box;transform-origin:center}
.hcat .cfur{fill:#B9BFC8;stroke:#4B5563;stroke-width:1.1}
.hcat .cbelly{fill:#E8EBEF}
.hcat .cear{fill:#8E96A2;stroke:#4B5563;stroke-width:1.1;stroke-linejoin:round}
.hcat .cearin{fill:#F9A8C4}
.hcat .cstripe{stroke:#6B7280;stroke-width:1.2;stroke-linecap:round;fill:none}
.hcat .ctail,.hcat .ctail2{fill:none;stroke:#9CA3AF;stroke-width:3.6;stroke-linecap:round}
.hcat .ctip{stroke:#5F6773;stroke-dasharray:0 78 22}
.hcat .ctail{transform-box:view-box;transform-origin:33px 35px}
.hcat .ceye{fill:#111827;transition:transform .8s ease}
.hcat .clid{fill:none;stroke:#374151;stroke-width:1.1;stroke-linecap:round;opacity:0;transition:opacity .8s}
.hcat .cnose{fill:#E26D8D}
.hcat .cmouth{fill:#7F1D1D;transform:scale(0)}
.hcat .cwhisk{stroke:#4B5563;stroke-width:.6;stroke-linecap:round;opacity:.7}
.hcat .cshut{fill:none;stroke:#1F2937;stroke-width:1.2;stroke-linecap:round}
.hcat .chead{transform-box:view-box;transform-origin:24px 22px}
.hcat .cpaw{transform-box:view-box;transform-origin:28.5px 38px}
.hcat .csit,.hcat .csleep{transition:opacity .9s ease}
.hcat .csleep{opacity:0}
.hcat .cz{font:800 7px/1 system-ui,sans-serif;fill:#7C8DB5;opacity:0}
.hcat .cbreath{transform-box:view-box;transform-origin:26px 37px}
.hcat .cbub{position:absolute;left:66px;top:62px;white-space:nowrap;background:var(--card,#fff);color:var(--ink,#111);font-size:0.875rem;font-weight:750;letter-spacing:0;line-height:1;padding:6px 10px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.18);opacity:0;transform:translateY(4px) scale(.9);pointer-events:none;transition:opacity .2s,transform .2s;z-index:3}
.hcat.react .cbub{opacity:1;transform:none}
.hcat.cat-energetic svg{animation:catBounce .7s ease-in-out infinite}
.hcat.cat-energetic .ctail{animation:catSwish .5s ease-in-out infinite alternate}
.hcat.cat-energetic .ceye{transform:scale(1.15);animation:catBlinkBig 3.6s infinite}
.hcat.cat-energetic .cpaw{animation:catPaw 1.4s ease-in-out infinite}
.hcat.cat-alert .ctail{animation:catSwish 1.6s ease-in-out infinite alternate}
.hcat.cat-alert .ceye{animation:catBlink 4.5s infinite}
.hcat.cat-alert .chead{animation:catTilt 6s ease-in-out infinite}
.hcat.cat-tired .ctail{animation:catSwishSoft 3.2s ease-in-out infinite alternate}
.hcat.cat-tired .ceye{transform:scaleY(.55);animation:catBlinkHalf 6s infinite}
.hcat.cat-tired .clid{opacity:1}
.hcat.cat-tired .cmouth{animation:catYawn 11s ease-in-out infinite}
.hcat.cat-drowsy .ctail{animation:catSwishSoft 5.5s ease-in-out infinite alternate}
.hcat.cat-drowsy .ceye{transform:scaleY(.28);animation:catBlinkSlow 5s ease-in-out infinite}
.hcat.cat-drowsy .clid{opacity:1}
.hcat.cat-drowsy .chead{animation:catNod 6s ease-in-out infinite}
.hcat.cat-drowsy .cmouth{animation:catYawn 8s ease-in-out infinite 2s}
.hcat.cat-sleep .csit{opacity:0}
.hcat.cat-sleep .csleep{opacity:1}
.hcat.cat-sleep .cbreath{animation:catBreath 3.6s ease-in-out infinite}
.hcat.cat-sleep .cz{animation:catZ 3.6s ease-in infinite}
.hcat.cat-sleep .cz2{animation-delay:1.2s}
.hcat.cat-sleep .cz3{animation-delay:2.4s}
.hcat.react:not(.cat-sleep) svg{animation:catStretch 1.1s ease-in-out}
.hcat.react.cat-sleep .cbreath{animation:catStir 1.1s ease-in-out}
@keyframes catBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes catSwish{from{transform:rotate(-20deg)}to{transform:rotate(16deg)}}
@keyframes catSwishSoft{from{transform:rotate(-7deg)}to{transform:rotate(6deg)}}
@keyframes catBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes catBlinkBig{0%,93%,100%{transform:scale(1.15)}96%{transform:scale(1.15,.1)}}
@keyframes catBlinkHalf{0%,88%,100%{transform:scaleY(.55)}93%{transform:scaleY(.08)}}
@keyframes catBlinkSlow{0%,60%,100%{transform:scaleY(.28)}72%,84%{transform:scaleY(.05)}}
@keyframes catTilt{0%,70%,100%{transform:rotate(0)}78%,90%{transform:rotate(-8deg)}}
