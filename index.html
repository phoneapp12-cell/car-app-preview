<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Car &amp; Life Due Dates</title>
<meta name="description" content="WOF, rego, servicing history, AA and licence dates, bills, to-dos, appointments, birthdays and ideas in one place, with reminders. Your data stays on your phone.">
<meta name="theme-color" content="#0F766E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Due Dates">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#F4F6F5; --card:#fff; --ink:#15201D; --ink2:#51605B; --ink3:#86938F; --line:#E4E9E7;
  --brand:#0F766E; --brand2:#E6F4F1;
  --red:#C62828; --redbg:#FDE8E8; --amber:#A15C07; --amberbg:#FEF1D6; --green:#1B7A3E; --greenbg:#E3F5E9;
  --due:#0F766E; --appt:#8B5CF6; --bday:#DB2777; --ext:#0A64C8; --hol:#C2410C;
  --radius:18px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:relative;width:100%;max-width:560px;height:100vh;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:600px){ html{background:#DDE3E1} #app{box-shadow:0 0 0 1px var(--line),0 10px 40px rgba(0,0,0,.08)} }
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:calc(var(--sat) + 10px) calc(16px + var(--sar)) 28px calc(16px + var(--sal));-webkit-overflow-scrolling:touch}
#view::-webkit-scrollbar{display:none}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:6px 0 12px}
.top h1{font-size:28px;line-height:1.15;margin:0;letter-spacing:-.5px}
.top .sub{color:var(--ink2);font-size:15px;margin-top:4px}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.08);color:var(--ink);flex:none}
.iconbtn.add{background:var(--brand);color:#fff}
.iconrow{display:flex;gap:8px;flex:none}
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 1px 2px rgba(16,24,20,.05);padding:14px}
.sec{font-size:13px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ink3);margin:22px 4px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec a,.sec button{text-transform:none;letter-spacing:0;font-weight:600;color:var(--brand);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 9px;white-space:nowrap}
.pill.over{color:var(--red);background:var(--redbg)} .pill.soon{color:var(--amber);background:var(--amberbg)} .pill.fine{color:var(--green);background:var(--greenbg)}
.pill.paid{color:var(--green);background:var(--greenbg)} .pill.none{color:var(--ink2);background:#EEF2F1}
.pill.bdaypill{color:#fff;background:var(--bday)} .pill.bdaysoon{color:#BE185D;background:#FCE7F3}
.row.bdtoday{background:#FDF2F8}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border-radius:16px;padding:12px;color:var(--ink);text-align:left}
.tile b{display:block;font-size:26px;line-height:1}
.tile span{font-size:13px;font-weight:600}
.tile.over{background:var(--redbg)} .tile.over b{color:var(--red)}
.tile.soon{background:var(--amberbg)} .tile.soon b{color:var(--amber)}
.tile.fine{background:var(--greenbg)} .tile.fine b{color:var(--green)}
.plate{display:inline-block;background:#fff;border:2px solid #1b1b1b;border-radius:6px;padding:1px 7px;font-weight:800;letter-spacing:1.5px;font-size:14px;font-family:"DIN Alternate","Arial Narrow",Arial,sans-serif;color:#111;line-height:1.35;white-space:nowrap}
.glance{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.glance button{background:var(--card);border-radius:16px;padding:10px 8px;text-align:left;box-shadow:0 1px 2px rgba(0,0,0,.05);min-width:0}
.glance .who{font-size:13px;font-weight:700;margin:7px 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glance .pill{font-size:11.5px;padding:3px 7px}
.list{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 2px rgba(16,24,20,.05)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left;min-height:56px}
.row:first-child{border-top:0}
.row .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.row .ic svg.i{width:20px;height:20px}
.row .tx{flex:1;min-width:0}
.row .t{font-weight:650;font-size:15.5px;line-height:1.25;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.3}
.ic.car{background:#E6F4F1;color:var(--brand)} .ic.bill{background:#FFF3E3;color:#B45309} .ic.todo{background:#EEF0FF;color:#4F46E5} .ic.appt{background:#F2ECFF;color:#7C3AED}
.ic.bday{background:#FCE7F3;color:#BE185D} .ic.hol{background:#FFEDD5;color:var(--hol)} .holhome{margin:0 0 12px} .ic.idea{background:#FEF6C7;color:#A16207} .ic.set{background:#EEF2F1;color:var(--ink2)} .ic.ext{background:#E6EFFB;color:var(--ext)}
.row>svg.i:last-child{color:var(--ink3);width:18px;height:18px}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;color:#fff;display:inline-block;vertical-align:1px;white-space:nowrap}
.tag.due{background:var(--due)} .tag.appt{background:var(--appt)} .tag.bday{background:var(--bday)} .tag.ext{background:var(--ext)} .tag.hol{background:var(--hol);max-width:104px}
.tag{max-width:92px;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;padding:22px 16px}
.empty .t{font-weight:700;font-size:16px}
.empty .s{color:var(--ink2);font-size:14px;margin:4px 0 12px;line-height:1.4}
/* tab bar */
.tabbar{flex:none;position:relative;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:6px calc(4px + var(--sar)) calc(8px + var(--sab)) calc(4px + var(--sal))}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--ink3);padding:4px 0;min-height:48px;justify-content:center}
.tabbar button.on{color:var(--brand)}
.tabbar .badge{position:absolute;left:14px;top:-4px;background:var(--red);color:#fff;font-size:10px;border-radius:999px;padding:1px 5px;font-weight:700;line-height:1.3}
.tabbar span.w{position:relative;display:flex}
/* cars */
.carcard{background:var(--card);border-radius:22px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.05);margin-bottom:12px;width:100%;text-align:left;display:block}
.carhead{display:flex;align-items:center;gap:12px}
.carpic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none}
.carpic svg.i{width:30px;height:30px;stroke:#fff}
.carname{font-weight:750;font-size:17px;overflow-wrap:anywhere}
.carmodel{font-size:13.5px;color:var(--ink2);margin-top:2px}
.triple{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.triple>div{background:#F6F8F7;border-radius:12px;padding:8px 9px;min-width:0}
.triple small{display:block;font-size:11.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.3px}
.triple b{display:block;font-size:14.5px;margin:2px 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.triple .pill{font-size:11.5px;padding:3px 7px}
.triple .addsvc{color:var(--brand);font-weight:700;font-size:13px;display:block;margin-top:4px;line-height:1.25}
.back{display:flex;align-items:center;gap:2px;color:var(--brand);font-weight:600;font-size:16px;padding:8px 0;min-height:44px}
.hero{display:flex;gap:14px;align-items:center;margin:4px 0 14px}
.hero .carpic{width:64px;height:64px;border-radius:20px}
.hero h2{margin:0 0 4px;font-size:24px;letter-spacing:-.3px;overflow-wrap:anywhere}
.callout{display:flex;gap:10px;background:var(--amberbg);color:#6B3D04;border-radius:14px;padding:11px 12px;font-size:14px;line-height:1.4;margin-bottom:12px}
.callout.red{background:var(--redbg);color:#7F1D1D}
.callout.blue{background:#E8F1FD;color:#123E73}
.callout.green{background:var(--greenbg);color:#14532D}
.callout svg.i{width:20px;height:20px;margin-top:1px}
.dcard{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.dcard .h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--ink2)}
.dcard .h .pill{margin-left:auto}
.big{font-size:23px;font-weight:750;margin:8px 0 2px;letter-spacing:-.3px}
.muted{color:var(--ink2);font-size:13.5px;line-height:1.45}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:12px 12px;font-weight:700;font-size:14.5px;background:#EAF0EE;color:var(--ink);white-space:nowrap;min-height:46px}
.btn.primary{background:var(--brand);color:#fff}
.btn.danger{background:var(--redbg);color:var(--red)}
.btn.small{flex:0 0 auto;padding:8px 12px;min-height:38px;font-size:14px}
.btn svg.i{width:18px;height:18px}
.btn:disabled{opacity:.5}
select.sel{font:inherit;font-size:15px;font-weight:600;color:var(--brand);border:1px solid var(--line);background:#F6F8F7;border-radius:10px;padding:7px 8px;min-height:40px}
.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.prices div{background:#F6F8F7;border-radius:10px;padding:7px 8px;text-align:center;font-size:12px;color:var(--ink2)}
.prices b{display:block;font-size:15px;color:var(--ink)}
.notes{white-space:pre-wrap;overflow-wrap:anywhere}
/* bills */
.summary{background:linear-gradient(135deg,#0F766E,#115E59);color:#fff;border-radius:22px;padding:16px}
.summary .amt{font-size:32px;font-weight:800;letter-spacing:-.5px;margin:4px 0}
.summary .muted{color:#CDEAE5}
.bill .right{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end}
.bill .amt{font-weight:750;font-size:16px}
.paybtn{margin-top:6px;font-size:13.5px;font-weight:700;color:var(--brand);background:var(--brand2);border-radius:999px;padding:7px 12px;white-space:nowrap}
.tapzone{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
/* todo */
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:2px 2px 4px;margin-bottom:10px}
.chips::-webkit-scrollbar{display:none}
.chip{border-radius:999px;padding:8px 14px;background:var(--card);font-weight:650;font-size:14px;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.06);flex:none}
.chip.on{background:var(--ink);color:#fff}
.chip.plus{color:var(--brand)}
.addbar{display:flex;gap:8px;margin-bottom:12px}
.addbar input{flex:1;min-width:0;border:0;border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.06);outline:none}
.addbar input:focus{box-shadow:0 0 0 2px var(--brand)}
.addbar button{width:48px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.tick{width:44px;height:44px;margin:-9px -6px -9px -9px;display:grid;place-items:center;flex:none}
.tick span{width:26px;height:26px;border-radius:50%;border:2px solid #B8C4C0;display:grid;place-items:center;transition:.15s}
.tick svg.i{width:15px;height:15px;stroke-width:3;color:#fff;opacity:0}
.done .tick span{background:var(--brand);border-color:var(--brand)}
.done .tick svg.i{opacity:1}
.done .t{text-decoration:line-through;color:var(--ink3)}
/* calendar */
.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.monthbar b{font-size:18px}
.monthbar .iconbtn{width:38px;height:38px;box-shadow:none;background:#F1F4F3}
.legend{display:flex;gap:12px;font-size:12.5px;color:var(--ink2);font-weight:600;margin:0 2px 10px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.grid .dow{font-size:11.5px;font-weight:700;color:var(--ink3);padding:4px 0}
.grid button{height:44px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;font-size:14.5px;font-weight:600;min-width:0}
.grid button.other{color:#B9C3C0}
.grid button span.n{width:26px;height:26px;display:grid;place-items:center;margin-top:-3px;border-radius:50%}
.grid button.today span.n{background:var(--brand);color:#fff}
.grid button.sel{background:var(--brand2)}
.grid .dots{display:flex;gap:3px;margin-top:2px;height:6px}
.grid .dots i{width:6px;height:6px;border-radius:50%}
.agday{font-size:13px;font-weight:700;color:var(--ink2);margin:14px 4px 6px}
.ev{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:6px;box-shadow:0 1px 2px rgba(0,0,0,.04);width:100%;text-align:left;min-height:50px}
.ev .bar{width:4px;align-self:stretch;border-radius:4px;flex:none}
.ev .time{width:62px;flex:none;font-size:12.5px;font-weight:650;color:var(--ink2)}
.ev .t{font-weight:650;font-size:15px;overflow-wrap:anywhere}
.ev .s{font-size:12.5px;color:var(--ink2);margin-top:3px}
/* service history + drivers */
.hist{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.hhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hhead b{font-size:15px}
.hhead button{color:var(--brand);font-weight:700;font-size:14px;padding:6px 0}
.spent{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 4px}
.spent div{background:#F6F8F7;border-radius:12px;padding:8px 10px}
.spent small{display:block;font-size:11.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.3px}
.spent b{font-size:17px}
.hlist{margin-top:4px}
.hrow{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.hlist .hrow:first-child{border-top:0}
.hrow .tx{flex:1;min-width:0}
.hrow .t{font-weight:650;font-size:14.5px}
.hrow .s{font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.35}
.hrow .cost{font-size:14.5px;white-space:nowrap}
.subhead{font-size:13px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--ink3);margin:6px 2px 10px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
.kv span{color:var(--ink2)} .kv b{text-align:right;overflow-wrap:anywhere}
.ic.driver{background:#EEF0FF;color:#4F46E5}
/* ideas */
.star{width:40px;height:40px;margin:-8px -4px -8px -8px;display:grid;place-items:center;flex:none;color:#B8C4C0}
.star.on{color:#E0A100} .star.on svg.i{fill:#F5B90B}
.cattag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--ink2);background:#EEF2F1;border-radius:6px;padding:1px 6px;margin-right:2px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.06);color:var(--ink3)}
.search input{flex:1;min-width:0;border:0;outline:none;font:inherit;font-size:16px;padding:11px 0;background:none;color:var(--ink)}
.search svg.i{width:19px;height:19px}
/* calendar links */
details.help{background:var(--card);border-radius:14px;margin-top:10px;padding:0 14px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
details.help summary{font-weight:700;font-size:15px;padding:13px 0;cursor:pointer;color:var(--brand);list-style-position:inside}
details.help[open] summary{padding-bottom:4px}
details.help ol{margin:0 0 12px}
.seg.swatches button{flex:1;min-width:0;padding:8px 0;display:grid;place-items:center}
.seg.swatches button i{width:24px;height:24px;border-radius:50%;background:var(--sw);display:block}
.seg.swatches button.on{background:#fff;border:2px solid var(--ink)}
.dcard.feed .btn.small{min-height:34px;padding:6px 10px;font-size:13.5px}
/* settings */
.srow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left;min-height:54px}
.srow:first-child{border-top:0}
.srow .tx{flex:1;min-width:0}
.srow .t{font-weight:650;font-size:15px}
.srow .s{font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.4}
.srow .v{font-size:14px;color:var(--ink2);font-weight:600;white-space:nowrap}
.switch{width:48px;height:30px;border-radius:999px;background:#CBD5D2;position:relative;flex:none;transition:.2s}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.switch.on{background:var(--brand)} .switch.on:after{left:21px}
.ok{color:var(--green);font-weight:700} .warn{color:var(--amber);font-weight:700} .bad{color:var(--red);font-weight:700}
.logo{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;flex:none}
.steps{margin:6px 0 0;padding-left:20px;font-size:13.5px;color:var(--ink2);line-height:1.5}
/* sheet (pop-up forms) */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.show{display:block}
#sheet .scrim{position:absolute;inset:0;background:rgba(10,20,17,.4);animation:fade .2s}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px calc(16px + var(--sar)) calc(18px + var(--sab)) calc(16px + var(--sal));animation:up .22s cubic-bezier(.2,.9,.3,1)}
#sheet .grab{width:40px;height:5px;border-radius:9px;background:#C9D2CF;margin:0 auto 8px}
#sheet h3{margin:4px 0 12px;font-size:20px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13.5px;font-weight:700;color:var(--ink2);margin:0 2px 5px}
.field input,.field select,.field textarea{width:100%;font:inherit;font-size:16px;border:1px solid #D5DDDA;border-radius:12px;padding:11px 12px;background:#fff;color:var(--ink);outline:none;min-height:46px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 2px rgba(15,118,110,.18)}
.field textarea{min-height:70px;resize:vertical}
.field small.datehint{color:var(--brand);font-weight:650;font-size:13px}
.field small{display:block;color:var(--ink3);font-size:12.5px;margin:4px 2px 0;line-height:1.35}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;border-radius:12px;padding:11px 8px;background:#fff;border:1px solid #D5DDDA;font-weight:700;font-size:14.5px;min-height:46px}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.formerr{color:var(--red);font-size:14px;font-weight:600;margin:-4px 2px 10px;display:none}
/* toast */
#toast{position:fixed;left:50%;width:calc(100% - 32px);max-width:528px;transform:translate(-50%,12px);bottom:calc(84px + var(--sab));z-index:60;background:#1C2623;color:#fff;border-radius:14px;padding:12px 14px;font-size:14.5px;display:flex;align-items:center;gap:10px;opacity:0;transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{margin-left:auto;color:#7FE0D2;font-weight:700;padding:4px 2px;flex:none}
.foot{text-align:center;font-size:12px;color:var(--ink3);margin:20px 0 4px;line-height:1.5}
@media (max-width:370px){ .top h1{font-size:25px} .tile{padding:10px} .tile b{font-size:23px} .triple>div{padding:7px 7px} .triple b{font-size:13.5px} .triple .pill{font-size:11px;padding:3px 6px} .btn{font-size:14px;padding:11px 10px} }
/* weather */
.wx{display:block;width:100%;text-align:left;margin-bottom:12px;padding:12px 14px}
.wxnow{display:flex;align-items:center;gap:10px}
.wxic{width:46px;height:46px;border-radius:14px;background:#FFF6DC;color:#B7791F;display:grid;place-items:center;flex:none}
.wxic svg.i{width:30px;height:30px}
.wxmain{display:flex;flex-direction:column;min-width:0;flex:1}
.wxtemp{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.5px}
.wxwords{font-size:14px;color:var(--ink2);font-weight:600;margin-top:3px}
.wxmeta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:13px;font-weight:650;color:var(--ink2);white-space:nowrap}
.wxmeta span{display:inline-flex;align-items:center;gap:3px}
.wxmeta svg.i{width:14px;height:14px;color:var(--ext)}
.wxdays{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.wxdays>div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
.wxdays .d{font-size:12px;color:var(--ink3);font-weight:700}
.wxdays svg.i{width:22px;height:22px;color:var(--ink2)}
.wxdays b{font-weight:750}
.wxdays .lo{color:var(--ink3);font-size:12px}
.wxfoot{font-size:11.5px;color:var(--ink3);margin-top:8px}
.wxempty{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:14px;font-weight:600}
.wxempty svg.i{color:var(--ink3)}
.wxbig .wxic{width:58px;height:58px}
.wxbig .wxic svg.i{width:38px;height:38px}
.wxbig .wxtemp{font-size:40px}
.wxfacts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.wxfacts small{display:block;font-size:12px;color:var(--ink3);font-weight:600}
.wxfacts b{font-size:15px}
.ic.wxi{background:#FFF6DC;color:#B7791F}
.wxhl{display:flex;flex-direction:column;align-items:flex-end;font-size:15px}
.wxhl span{color:var(--ink3);font-size:13px}
.foot a{color:inherit;text-decoration:underline}
/* events */
.ic.ev{background:#FFEDE3;color:#C2410C}
.ic.br{background:#E0F2FE;color:#0369A1}
.card.bridge{margin-bottom:12px;padding:14px}
.brhead{display:flex;align-items:center;gap:10px}
.brhead .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.brhead .ic svg.i{width:22px;height:22px}
.brhead .tx{flex:1;min-width:0}
.brhead .t{font-weight:700;font-size:15px;line-height:1.25}
.brhead .s{font-size:12.5px;color:var(--ink2);margin-top:1px}
.brhead .pill{flex:none}
.brstate{font-size:17px;font-weight:700;margin:12px 0 4px;line-height:1.3}
.brsub{font-size:14px;color:var(--ink2);margin:0 0 6px;line-height:1.4}
.brnext{font-size:14px;color:var(--ink);line-height:1.4}
.brclose,.brwarn{display:flex;gap:6px;align-items:flex-start;font-size:13.5px;color:var(--amber);margin-top:8px;line-height:1.35}
.brclose svg,.brwarn svg{flex:none;width:16px;height:16px;margin-top:1px}
.brnote{font-size:12px;color:var(--ink2);margin-top:10px;font-weight:600}
.card.bridge .btns{margin:10px 0 0}
.brlist{margin:0 0 12px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin-left:-2px;margin-right:-2px;scrollbar-width:none}
.evcard{margin-bottom:8px;padding:13px 14px}
.evt{font-weight:750;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.evm{display:flex;gap:6px;align-items:flex-start;font-size:13.5px;color:var(--ink2);margin-top:5px;line-height:1.35}
.evm svg.i{width:16px;height:16px;margin-top:1px;color:var(--ink3)}
.evd{font-size:14px;color:var(--ink);margin-top:7px;line-height:1.4}
.evtags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.evtags span{font-size:12px;font-weight:650;color:var(--ink2);background:#EEF2F1;border-radius:6px;padding:2px 7px}
.evtags .cost{background:var(--greenbg);color:var(--green)}
.evcard .btns{margin-top:10px}
.btn.added{background:var(--greenbg);color:var(--green)}
.tag.appt{max-width:92px}
</style>
</head>
<body>
<div id="app">
  <main id="view"><noscript>This app needs JavaScript turned on.</noscript></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"><span id="toastmsg"></span><button id="toastbtn"></button></div>
<script src="core.js"></script>
<script src="ical-import.js"></script>
<script src="app.js"></script>
</body>
</html>
