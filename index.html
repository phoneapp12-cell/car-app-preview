.rechead .recsub{margin-bottom:0}
.rectitle{font-size:1.625rem;line-height:1.2;margin:4px 0 2px}
.recsub{margin-bottom:8px}
.recmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px;font-size:0.8125rem}
.recplanned{margin-bottom:4px;font-size:0.875rem}
.recingr ul{margin:0;padding-left:20px}
.recingr li{margin:3px 0;line-height:1.4}
.recmethod ol{margin:0;padding-left:22px}
.recmethod li{margin:0 0 10px;line-height:1.5}
.recmethod li:last-child{margin-bottom:0}
.onlist{display:inline-block;font-size:0.6875rem;font-weight:700;color:var(--gftag-fg);background:var(--gftag-bg);border-radius:5px;padding:0 5px;white-space:nowrap}
textarea.tall{min-height:150px}
.gfwarn{background:var(--warn-bg);color:var(--warn-fg);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:0.875rem;line-height:1.4}
.scantips{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:0.875rem;margin-bottom:10px}
.scanstat{margin:4px 0 12px}
.scanstat .t{font-size:0.875rem;font-weight:600;margin-bottom:6px}
.scanstat .bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.scanstat .bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .3s}
.scanpage{background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.scanhead{display:flex;gap:8px;align-items:center;font-size:0.875rem;margin-bottom:6px}
.scanhead .linkbtn{margin-left:auto}
.scanpage pre{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit;font-size:0.8125rem;color:var(--ink2);max-height:140px;overflow:auto}
.plannights{margin-bottom:12px}
.shopitem .t .chk{margin-left:4px}
/* Loans (1.10.0) */
.ic.loan{background:var(--loan-bg);color:var(--loan-fg)}
.loanpic{background:var(--loanpic)}
.loancard .carhead>svg.i{color:var(--ink3);width:18px;height:18px;flex:none}
.lowed{margin-top:12px}
.lowed small{display:block;font-size:0.71875rem;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.3px}
.lamt{display:block;font-size:1.875rem;font-weight:800;letter-spacing:-.5px;color:var(--ink);margin-top:1px}
.lbar{height:10px;border-radius:999px;background:var(--soft2);overflow:hidden;margin:8px 0}
.lbar i{display:block;height:100%;border-radius:999px;background:var(--brand)}
.lstats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:0.84375rem;color:var(--ink2)}
.lstats b{color:var(--ink)}
.lstats .lpct{margin-left:auto;font-weight:700;color:var(--brand)}
.lplan{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:0.84375rem;color:var(--ink2);background:var(--soft);border-radius:10px;padding:8px 10px;line-height:1.35}
.lplan svg.i{width:16px;height:16px;flex:none;color:var(--brand)}
.summary .lbar{background:rgba(0,0,0,.2);margin:10px 0 8px}
.summary .lbar i{background:var(--onbrand)}
.lsumrow{display:flex;justify-content:space-between;gap:10px;font-size:0.875rem;opacity:.92}
.loandet .muted svg.i{width:16px;height:16px;vertical-align:-3px}
.loansum,.loandet{margin-bottom:12px}
.btn.xl{min-height:56px;font-size:1.03125rem;border-radius:14px}
.lpay .lpa{font-size:0.96875rem;white-space:nowrap}
.lpay.start .t{color:var(--ink2)}
.lquick{margin:-4px 0 12px}
.lquick .chip{background:var(--soft2);box-shadow:none;color:var(--brand)}
.loansdone{margin-top:4px}
.loansdone summary .pr{font-weight:700}
/* Settings › Appearance (v1.9.0) */
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.theme{background:var(--card);border-radius:16px;padding:8px;border:2px solid transparent;box-shadow:0 1px 2px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:6px;min-width:0}
.theme.on{border-color:var(--brand)}
.tprev{display:block;position:relative;height:62px;border-radius:10px;overflow:hidden;border:1px solid rgba(128,128,128,.25)}
.tbar{position:absolute;left:0;right:0;top:0;height:12px}
.tcard{position:absolute;left:7px;right:7px;top:18px;height:22px;border-radius:6px;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 6px}
.tcard i{display:block;height:4px;border-radius:2px;width:70%}
.tcard i+i{width:45%}
.tbtn{position:absolute;right:7px;bottom:6px;width:26px;height:12px;border-radius:6px}
.tname{display:flex;align-items:center;justify-content:center;gap:3px;font-weight:700;font-size:0.84375rem;color:var(--ink)}
.tname svg.i{width:15px;height:15px;color:var(--brand);stroke-width:2.6}
</style>
</head>
<body>
<div id="app">
  <main id="view"><noscript>This app needs JavaScript turned on.</noscript></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"><span id="toastmsg"></span><button id="toastbtn"></button></div>
<script src="core.js"></script>
<script src="ical-import.js"></script>
<script src="app.js"></script>
</body>
</html>
